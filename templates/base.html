{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Venom Watch{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark venom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'snake_detector:index' %}">
                <img src="{% static 'images/logo.svg' %}" alt="Venom Watch Logo" class="venom-logo me-2">
                <span class="fw-bold">Venom<span class="text-warning">Watch</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'snake_detector:index' %}">
                            <i class="bi bi-camera"></i> Detect
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="venom-footer mt-auto py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h6 class="text-warning fw-bold">Venom Watch</h6>
                    <p class="small text-muted mb-0">AI-Powered Snake Detection System</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="small text-muted mb-0">&copy; {% now "Y" %} Venom Watch Team</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
